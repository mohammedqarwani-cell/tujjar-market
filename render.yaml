# Render Blueprint for the public DEMO of the Tujjar Market API (see docs/DEPLOY.md).
# The three web interfaces run on Vercel and reach this API through their own /api proxy.
services:
  - type: web
    name: tujjar-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: apps/api
    buildCommand: npm ci && npx prisma generate && npm run build
    # Migrations run on every start; demo data is loaded only into an empty database
    startCommand: npx prisma migrate deploy && npm run db:seed-demo && node dist/src/main
    healthCheckPath: /categories
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
      # Demo only: codes are shown on screen because no SMS provider is contracted yet
      - key: DEMO_MODE
        value: "true"
      - key: OTP_DEV_ECHO
        value: "true"
      # Visitor -> Vercel proxy -> Render proxy -> API
      - key: TRUST_PROXY
        value: "2"
      - key: COOKIE_SECURE
        value: "true"
      # Browsers reach the API as https://<interface>.vercel.app/api/...
      - key: COOKIE_PATH_PREFIX
        value: /api
      - key: TERMS_VERSION
        value: 2026-09
      # Bucket names: Supabase reserves "public", so the demo uses tujjar-public and tujjar-kyc
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_PRIVATE_BUCKET
        sync: false

      # Random 256-bit base64 values generated by Render and never stored in the repository
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: TOTP_ENC_KEY
        generateValue: true
      - key: KYC_ENC_KEY
        generateValue: true
      # Demo account passwords (read them in the Render dashboard)
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_MERCHANT_PASSWORD
        generateValue: true
      - key: SEED_BUYER_PASSWORD
        generateValue: true

      # Filled in the dashboard from Supabase and Vercel
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_REGION
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: MERCHANT_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
