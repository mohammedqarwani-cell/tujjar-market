services:
  postgres:
    image: postgres:16
    container_name: tujjar_postgres
    environment:
      POSTGRES_USER: tujjar
      POSTGRES_PASSWORD: tujjarpass
      POSTGRES_DB: tujjar_db
    ports:
      - "5432:5432"
    volumes:
      # Named volume: Postgres on a Windows bind mount is slow and crash-prone
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tujjar -d tujjar_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tujjar_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpass123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - ./minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
